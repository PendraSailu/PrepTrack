{% extends "base.html" %}

{% block title %}Login | PrepTrack{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Welcome Back</h1>
    <p>Log in to continue tracking your preparation.</p>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('login') }}">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
                autocomplete="email"
                autofocus
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                    aria-label="Show password"
                    aria-pressed="false"
                >
                    Show
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary">
            Login
        </button>

    </form>

    <p class="auth-link">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create an account</a>
    </p>
</div>

<script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
        const isPasswordHidden = passwordInput.type === "password";

        passwordInput.type = isPasswordHidden ? "text" : "password";
        togglePassword.textContent = isPasswordHidden ? "Hide" : "Show";
        togglePassword.setAttribute("aria-label", isPasswordHidden ? "Hide password" : "Show password");
        togglePassword.setAttribute("aria-pressed", String(isPasswordHidden));
    });
</script>

{% endblock %}
